# Reproducible bench infrastructure: pgvector + qdrant.
# LanceDB and Chroma are embedded — no service needed.
#
# Brought up via `make up`; tear down via `make down -v`. Versions pinned
# so the published bench numbers can be reproduced exactly.

services:
  pgvector:
    # Pin both the pgvector extension version *and* the Postgres major so
    # the published bench numbers are reproducible — `pg17` alone floats
    # the extension version. 0.8.0 is the version the bench numbers in
    # README.md were captured against; bump deliberately when re-running
    # the full sweep.
    image: pgvector/pgvector:0.8.0-pg17
    container_name: vdbbench-pgvector
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      # Host port is overridable: `PGVECTOR_PORT=5444 docker compose up`
      # (or `make up PGVECTOR_PORT=5444`). Default 5433 keeps the bench DSN
      # baked into the CLI defaults working on a stock host.
      - "${PGVECTOR_PORT:-5433}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Postgres tuning suitable for a 1M-vector benchmark on a laptop;
    # tune up for production-class hosts.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - max_parallel_workers_per_gather=2

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: vdbbench-qdrant
    ports:
      # Host port is overridable via `QDRANT_PORT` (defaults to 6333). The
      # gRPC port (6334) shifts in lockstep so a `QDRANT_PORT=6343` run
      # publishes 6343/6344 cleanly and the bench DSN stays consistent.
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant/qdrant:v1.17.0 ships without curl or wget, so the previous
      # wget-based healthcheck always reported the container unhealthy
      # and `up --wait` timed out. bash *is* present, so use a pure
      # connect/close probe via bash's /dev/tcp builtin to verify the
      # HTTP port is accepting connections. The earlier `cat
      # </dev/tcp/...` form blocked the probe waiting for response
      # bytes (or EOF), which routinely burned the 5s timeout and kept
      # Qdrant marked unhealthy long after the socket was actually
      # accepting connections; the redirect form below opens fd 3 and
      # immediately closes it, so the probe returns the moment TCP
      # connect succeeds. This is a strict-enough readiness signal for
      # the bench harness, which retries the actual API call with its
      # own backoff after `make up` returns.
      test:
        ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && exec 3<&- 3>&-' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgvector_data:
  qdrant_data:
