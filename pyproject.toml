[project]
name = "vdbbench"
version = "0.1.0"
description = "Reproducible side-by-side benchmark of pgvector, Qdrant, LanceDB and Chroma."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bishara Mekhaeil" }]
keywords = ["vector-database", "benchmark", "pgvector", "qdrant", "lancedb", "chroma", "ann"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]

# Core deps (must work on every supported platform, including Intel macOS).
# Heavy ML deps are split into extras below — install them on Linux / arm64
# macOS, or use the provided Docker images.
dependencies = [
    # Numerics + data
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    # CLI + UX
    "typer>=0.12",
    "rich>=13.7",
    # HTTP + IO
    "httpx>=0.27",
    "tqdm>=4.66",
    # Datasets (lazy — also available as embed extra dependency)
    "datasets>=2.20",
    # Vector store SDKs that have wheels everywhere
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "qdrant-client>=1.10",
    # Observability for runs
    "prometheus-client>=0.20",
    "psutil>=6.0",
    # Plots
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.urls]
Homepage = "https://github.com/BishBish123/vector-db-bench"
Repository = "https://github.com/BishBish123/vector-db-bench"
Issues = "https://github.com/BishBish123/vector-db-bench/issues"

[project.scripts]
vdbbench = "vdbbench.cli:app"

[project.optional-dependencies]
# Embedding generation (torch + sentence-transformers). torch dropped macOS
# x86_64 wheels at 2.3, so this extra is only resolvable on Linux, arm64
# macOS, and Windows. Intel macOS users run encoding inside the Docker image.
embed = [
    "sentence-transformers>=3.0,<4 ; (sys_platform == 'darwin' and platform_machine == 'arm64') or sys_platform == 'linux' or sys_platform == 'win32'",
    "torch>=2.2,<2.8 ; (sys_platform == 'darwin' and platform_machine == 'arm64') or sys_platform == 'linux' or sys_platform == 'win32'",
]

# Chroma also pulls onnxruntime (no Intel macOS wheels). Same gate as embed.
chroma = [
    "chromadb>=0.5 ; (sys_platform == 'darwin' and platform_machine == 'arm64') or sys_platform == 'linux' or sys_platform == 'win32'",
]

# LanceDB only ships wheels for Linux + arm64 macOS + Windows.
lance = [
    "lancedb>=0.13 ; (sys_platform == 'darwin' and platform_machine == 'arm64') or sys_platform == 'linux' or sys_platform == 'win32'",
]

# Wikipedia corpus streaming (the `datasets` library). Already present in the
# base deps, but declared here so `uv sync --extra wiki` is the documented
# install path and the dep can be removed from base when/if desired.
wiki = ["datasets>=2.20"]

# Convenience: every adapter at once. Resolves only on supported platforms.
all-adapters = [
    "vdbbench[embed,chroma,lance]",
]

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-tqdm",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

# Notebook analysis — regenerates charts from results/demo/summary.parquet.
# Install with: uv sync --extra plot
# Then run: make analysis
plot = ["matplotlib>=3.8", "jupyter>=1.0", "nbclient>=0.10"]

# Profiling extras — py-spy for flame graphs (opt-in, not in base deps).
# Install with: pip install "vdbbench[profile]"
# Then use: vdbbench bench --profiler py-spy
profile = ["py-spy>=0.4"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vdbbench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplifiable
    "PL",   # pylint subset
    "RUF",  # ruff-specific
]
ignore = [
    "PLR0913",  # too many arguments — benchmark adapters legitimately have many
    "PLR2004",  # magic value — common in benchmarks (k=10, etc.)
    "E501",     # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
# typer's idiomatic API uses function calls for option metadata in argument
# defaults, which is exactly what B008 normally rejects.
"src/vdbbench/cli.py" = ["B008"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true
disallow_untyped_decorators = false  # typer decorators

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
testpaths = ["tests"]
markers = [
    "slow: tests that take more than ~1s",
    "integration: tests that touch a real DB (need Docker)",
    "gpu: tests that need MPS/CUDA",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:torch",
    "ignore::UserWarning:torch",
    "ignore::FutureWarning:huggingface_hub",
]

[tool.coverage.run]
branch = true
source = ["vdbbench"]
omit = ["*/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
