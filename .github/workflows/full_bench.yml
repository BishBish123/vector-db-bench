      #   uses: softprops/action-gh-release@v2
      #   with:
      #     tag_name: bench-1m-${{ github.run_id }}
      #     name: "1M MS-MARCO benchmark run ${{ github.run_id }}"
      #     body: |
      #       Automated 1M MS-MARCO benchmark triggered manually via workflow_dispatch.
      #     files: |
      #       results/1m/**
      #       assets/1m/**
